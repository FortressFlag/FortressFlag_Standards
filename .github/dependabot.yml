# Automated dependency updates.
#
# SOC 2 (CC7.1) asks for a *process* that finds and remediates vulnerable components, not just a
# scanner that reports them.
#
# Only GitHub Actions: this repo is docs and JSON vectors — there is no package ecosystem here,
# and there never should be (no implementation code lives in this repo, by design).

version: 2
updates:
  # The workflow itself is a dependency. A compromised or abandoned action runs with our token.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
